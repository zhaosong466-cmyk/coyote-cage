<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#08090b" />
<title>画地为牢 · ZONE</title>
<style>
  :root{
    --ink:#08090B; --panel:#0E1013; --raise:#14171B;
    --line:rgba(233,230,222,.12); --line-2:rgba(233,230,222,.30);
    --bone:#E9E6DE; --dim:#8B9099;
    --mint:#6FE3A4; --signal:#FF4B1F; --amber:#F2B33D;
  }
  *{box-sizing:border-box}
  .hidden{display:none!important}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);
    font:14px/1.45 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100dvh}

  /* ---------------- 顶栏 ---------------- */
  .bar{display:flex;align-items:center;gap:12px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:15px;white-space:nowrap}
  .brand .sub{margin-left:8px;vertical-align:2px;color:var(--dim);
    font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;
    border:1px solid var(--line);padding:3px 6px;border-radius:2px}
  .status{flex:1;min-width:0;text-align:right;color:var(--dim);
    font:11px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 连接方式胶囊：中继 / 蓝牙，点一下直接切 */
  .chip{flex:0 0 auto;appearance:none;cursor:pointer;padding:7px 9px;border-radius:2px;
    border:1px solid var(--line);background:transparent;color:var(--dim);
    font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;
    transition:color .12s,border-color .12s}
  .chip:hover{border-color:var(--line-2);color:var(--bone)}
  .chip.on{color:var(--mint);border-color:rgba(111,227,164,.45)}

  /* ---------------- 按键 ---------------- */
  .key{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--bone);
    font:500 13px/1 inherit;letter-spacing:.02em;padding:11px 14px;border-radius:2px;
    cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .key:hover{border-color:var(--line-2)}
  .key:active{transform:translateY(1px)}
  .key:disabled{opacity:.3;cursor:not-allowed}
  .key.ghost{background:transparent}
  .key.sm{padding:7px 12px;font-size:12px}
  .key.primary{background:var(--bone);border-color:var(--bone);color:#0A0B0C;font-weight:600}

  /* ---------------- 取景器 ---------------- */
  .stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  /* 运行中的「指示灯」：舞台顶部一条琥珀色细线 */
  .tally{position:absolute;top:0;left:0;right:0;height:2px;z-index:2;
    background:transparent;transition:background .18s,box-shadow .18s}
  .stage.live .tally{background:var(--amber);box-shadow:0 0 14px rgba(242,179,61,.55)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(115% 85% at 50% 45%,transparent 52%,rgba(0,0,0,.55) 100%)}
  .brackets{position:absolute;inset:0;pointer-events:none}
  .brackets i{position:absolute;width:20px;height:20px;border:1.5px solid rgba(233,230,222,.32)}
  .brackets i:nth-child(1){top:10px;left:10px;border-right:0;border-bottom:0}
  .brackets i:nth-child(2){top:10px;right:10px;border-left:0;border-bottom:0}
  .brackets i:nth-child(3){bottom:10px;left:10px;border-right:0;border-top:0}
  .brackets i:nth-child(4){bottom:10px;right:10px;border-left:0;border-top:0}

  .hud{position:absolute;pointer-events:none;display:flex;align-items:baseline;gap:8px;
    font:11px/1.35 ui-monospace,Consolas,monospace;letter-spacing:.06em;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .hud-tl{top:16px;left:22px}
  .hud-bl{bottom:16px;left:22px;max-width:calc(100% - 160px);flex-wrap:wrap}
  .hud .lbl{font-size:9px;letter-spacing:.24em;color:rgba(233,230,222,.42)}
  #phase{color:var(--bone);font-weight:600}
  #meter{color:var(--dim)}
  #meter b{color:var(--amber);font-weight:600}

  /* 限时倒计时：右下角常驻，点开可以加时或取消 */
  #btnTimer{position:absolute;right:22px;bottom:16px;appearance:none;cursor:pointer;
    padding:5px 9px;border:1px solid var(--line);border-radius:2px;
    background:rgba(8,9,11,.6);color:var(--dim);
    font:11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.06em;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #btnTimer:hover{border-color:var(--line-2);color:var(--bone)}
  #btnTimer b{color:var(--amber);font-weight:600}
  #timerMenu{position:absolute;right:22px;bottom:52px;z-index:5;display:flex;gap:8px;
    padding:8px;border:1px solid var(--line-2);border-radius:2px;
    background:rgba(14,16,19,.96);box-shadow:0 10px 30px rgba(0,0,0,.6)}

  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
    max-width:86%;padding:10px 14px;border:1px solid var(--line);border-radius:2px;
    background:rgba(8,9,11,.82);color:var(--bone);font-size:12px;line-height:1.7;
    text-align:center;white-space:pre-wrap;backdrop-filter:blur(4px)}
  .hint.retry{pointer-events:auto;cursor:pointer;border-color:var(--line-2)}
  .hint.retry:hover{border-color:var(--bone)}

  /* ---------------- 控制带 ---------------- */
  .strip{display:flex;justify-content:center;gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--line)}
  .strip .key{flex:1 1 0;max-width:170px}
  .strip .key.primary{flex:1.4 1 0;max-width:200px}
  @media (max-width:520px){
    .key{padding:11px 8px;font-size:12px}
    .strip .key.primary{flex:1.3 1 0;max-width:none}
  }

  /* ---------------- 面板 ---------------- */
  dialog{border:1px solid var(--line-2);background:var(--panel);color:var(--bone);
    padding:0;border-radius:3px;width:min(720px,94vw)}
  dialog::backdrop{background:rgba(4,5,6,.76);backdrop-filter:blur(3px)}
  .sheet{display:flex;flex-direction:column;max-height:88dvh}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;color:var(--dim);text-transform:uppercase;
    font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em}
  .sheet-body{padding:2px 18px 20px;overflow:auto}
  .sheet-body section{padding-top:18px}
  .sheet-body h3{margin:0 0 12px;color:rgba(233,230,222,.52);text-transform:uppercase;
    font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em}

  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 22px}
  .field{display:block;min-width:0;font-size:12px}
  .field .line{display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin-bottom:7px}
  .field .line span:first-child{color:var(--dim)}
  .field output{min-width:36px;padding:3px 7px;border-radius:2px;text-align:right;
    color:var(--amber);background:rgba(242,179,61,.07);border:1px solid rgba(242,179,61,.28);
    font:600 11px/1 ui-monospace,Consolas,monospace}
  input[type=range]{width:100%;height:20px;accent-color:var(--bone);background:transparent}
  select,input[type=text],textarea{width:100%;padding:9px;border-radius:2px;
    border:1px solid var(--line);background:#0A0C0E;color:var(--bone);font:inherit}
  select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--line-2)}
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .checkline{display:flex;flex-direction:row-reverse;align-items:center;
    justify-content:flex-end;gap:10px;font-size:12px;color:var(--dim)}
  .checkline input{width:18px;height:18px;accent-color:var(--mint)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chips button{padding:7px 12px;border-radius:2px;border:1px solid var(--line);
    background:transparent;color:var(--bone);font:500 12px/1 inherit;cursor:pointer}
  .chips button:hover{border-color:var(--line-2)}
  .chips button.on{background:var(--bone);border-color:var(--bone);color:#0A0B0C;font-weight:600}
  .err{margin-top:6px;color:var(--signal);font-size:11px}
  .actions{display:flex;gap:10px;margin-top:22px}
  .actions .key{flex:1}

  /* 调试输出：只在不连设备时用 */
  #debugLog{max-height:190px;overflow:auto;padding:9px 10px;border-radius:2px;
    border:1px solid var(--line);background:#0A0C0E;
    font:10px/1.6 ui-monospace,Consolas,monospace;color:#C9CDD3;white-space:pre-wrap}
  #debugLog .empty{color:var(--dim)}

  #qrBox{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}  #qrHolder{width:232px;height:232px;background:#fff;display:flex;
    align-items:center;justify-content:center;overflow:hidden}
  #pairUrl{text-align:center;word-break:break-all;color:var(--dim);
    font:10px/1.4 ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">画地为牢<span class="sub">ZONE</span></div>
    <div class="status" id="status">未连接</div>
    <button id="btnMode" class="chip" title="切换连接方式">中继</button>
    <button id="btnConn" class="key ghost sm">连接</button>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="tally" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="hud hud-tl"><span class="lbl">STATE</span><span id="phase">未开始</span></div>
    <div class="hud hud-bl" id="meter"></div>
    <button id="btnTimer" class="hidden">剩余 <b>00:00</b></button>
    <div id="timerMenu" class="hidden">
      <button class="key sm" id="btnPlus5">+5 分钟</button>
      <button class="key sm" id="btnNoLimit">取消限时</button>
    </div>
    <div class="hint" id="hint">正在启动摄像头…</div>
  </div>

  <footer class="strip">
    <button id="btnRun" class="key primary" disabled>开始</button>
    <button id="btnSel" class="key">框选</button>
    <button id="btnCam" class="key">镜头</button>
    <button id="btnSet" class="key">设置</button>
  </footer>
</div>

<dialog id="dlgSet">
  <div class="sheet">
    <header class="sheet-head">
      <h2>参数</h2>
      <button id="btnCloseSet" class="key ghost sm">关闭</button>
    </header>
    <div class="sheet-body">

      <section>
        <h3>连接</h3>
        <div class="fields">
          <label class="field">连接方式
            <select id="selLink">
              <option value="relay">中继（DG-LAB Socket）</option>
              <option value="ble">蓝牙直连（本机 BLE）</option>
            </select></label>
          <label class="checkline">调试模式（不连设备，只记录输出） <input type="checkbox" id="cDebug" /></label>
        </div>
        <div class="fields hidden" id="rowRelay">
          <label class="field">中继地址
            <input type="text" id="txtRelay" spellcheck="false" /></label>
        </div>
        <div class="fields hidden" id="rowBle">
          <label class="field"><span class="line"><span>波形频率平衡 (0–255)</span><output id="oBalF"></output></span>
            <input type="range" id="rBalF" min="0" max="255" step="1" /></label>
          <label class="field"><span class="line"><span>波形强度平衡 (0–255)</span><output id="oBalS"></output></span>
            <input type="range" id="rBalS" min="0" max="255" step="1" /></label>
        </div>
        <div class="err hidden" id="bleHint">这个浏览器不支持 Web Bluetooth，蓝牙直连需要桌面 / 安卓版 Chrome 或 Edge，且页面必须是 https 或 localhost。</div>
        <div class="err hidden" id="bleWarn">蓝牙直连时同一时间只能由本页连接，先断开手机上的 DG-LAB APP。</div>
      </section>

      <section id="rowDebug" class="hidden">
        <h3>调试输出</h3>
        <div id="debugLog"></div>
      </section>

      <section>
        <h3>强度</h3>
        <div class="fields">
          <label class="field"><span class="line"><span>基础强度</span><output id="oBase"></output></span>
            <input type="range" id="rBase" min="1" max="40" step="1" /></label>
          <label class="field"><span class="line"><span>强度上限</span><output id="oMax"></output></span>
            <input type="range" id="rMax" min="1" max="100" step="1" /></label>
          <label class="field"><span class="line"><span>每级递增</span><output id="oStep"></output></span>
            <input type="range" id="rStep" min="1" max="10" step="1" /></label>
          <label class="field"><span class="line"><span>每 N 秒涨一级</span><output id="oEvery"></output></span>
            <input type="range" id="rEvery" min="1" max="30" step="1" /></label>
          <label class="checkline">随越界时间递增 <input type="checkbox" id="cEsc" /></label>
        </div>
      </section>

      <section>
        <h3>时机</h3>
        <div class="fields">
          <label class="field"><span class="line"><span>单次输出 (ms)</span><output id="oShock"></output></span>
            <input type="range" id="rShock" min="100" max="3000" step="50" /></label>
          <label class="field"><span class="line"><span>两次间隔 (ms)</span><output id="oGap"></output></span>
            <input type="range" id="rGap" min="200" max="10000" step="100" /></label>
          <label class="field"><span class="line"><span>越界容忍 (ms)</span><output id="oGrace"></output></span>
            <input type="range" id="rGrace" min="0" max="1500" step="50" /></label>
        </div>
      </section>

      <section>
        <h3>判定</h3>
        <div class="fields">
          <label class="field">检测部位
            <select id="selPoint">
              <option value="torso">躯干（双肩 + 双髋）</option>
              <option value="low">低姿态（跪 / 坐）</option>
              <option value="full">全身</option>
              <option value="feet">双脚</option>
            </select></label>
          <label class="field">判定方式
            <select id="selJudge">
              <option value="points">逐点判定</option>
              <option value="bbox">包围盒判定</option>
            </select></label>
          <label class="field">姿态丢失时
            <select id="selLost">
              <option value="violate">视为越界</option>
              <option value="pause">暂停判定</option>
              <option value="ignore">保持上次判定</option>
            </select></label>
          <label class="field">框模式
            <select id="selFrame">
              <option value="manual">固定框（手画）</option>
              <option value="random">随机框</option>
              <option value="pose">姿势锁定</option>
            </select></label>
          <label class="field">输出通道
            <select id="selChannel"><option value="0">A</option><option value="1">B</option></select></label>
          <label class="field"><span class="line"><span>开局准备倒计时 (秒)</span><output id="oPrepare"></output></span>
            <input type="range" id="rPrepare" min="0" max="10" step="1" /></label>
          <label class="field hidden" id="rowRandom"><span class="line"><span>随机间隔 (秒)</span><output id="oRandom"></output></span>
            <input type="range" id="rRandom" min="5" max="60" step="1" /></label>
          <label class="field hidden" id="rowPose"><span class="line"><span>姿势容差 (% 画面高度)</span><output id="oPoseTol"></output></span>
            <input type="range" id="rPoseTol" min="1" max="12" step="1" /></label>
        </div>
      </section>

      <section>
        <h3>会话</h3>
        <div class="fields">
          <label class="field"><span class="line"><span>限时 (分钟，0 = 不限)</span><output id="oSession"></output></span>
            <input type="range" id="rSession" min="0" max="120" step="5" /></label>
          <label class="checkline">开始前询问时长 <input type="checkbox" id="cAsk" /></label>
        </div>
      </section>

      <section>
        <h3>挑逗</h3>
        <div class="fields">
          <label class="checkline">启用挑逗 <input type="checkbox" id="cTease" /></label>
        </div>
        <div class="fields hidden" id="rowTease">
          <label class="field"><span class="line"><span>最短间隔 (秒)</span><output id="oTeaseMin"></output></span>
            <input type="range" id="rTeaseMin" min="5" max="120" step="1" /></label>
          <label class="field"><span class="line"><span>最长间隔 (秒)</span><output id="oTeaseMax"></output></span>
            <input type="range" id="rTeaseMax" min="5" max="120" step="1" /></label>
          <label class="field"><span class="line"><span>强度 (基础强度的 %)</span><output id="oTeasePct"></output></span>
            <input type="range" id="rTeasePct" min="10" max="100" step="5" /></label>
          <label class="field"><span class="line"><span>持续 (ms)</span><output id="oTeaseMs"></output></span>
            <input type="range" id="rTeaseMs" min="200" max="800" step="100" /></label>
          <label class="field">挑逗波形
            <select id="selTeaseWave"></select></label>
        </div>
        <div class="actions hidden" id="rowTeaseTest">
          <button id="btnTeaseTest" class="key">试一次挑逗</button>
        </div>
      </section>

      <section>
        <h3>波形</h3>
        <div class="chips" id="presetRow"></div>
        <label class="field"><span class="line"><span>每行 16 位 HEX · 一帧 8 字节 · 100ms</span></span>
          <textarea id="txtWave" spellcheck="false"></textarea></label>
        <div class="err hidden" id="waveErr">格式不对：每行必须正好 16 个十六进制字符</div>
      </section>

      <div class="actions">
        <button id="btnTest" class="key">用当前强度试一次</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlgDur">
  <div class="sheet">
    <header class="sheet-head">
      <h2>本次时长</h2>
      <button id="btnCloseDur" class="key ghost sm">取消</button>
    </header>
    <div class="sheet-body">
      <section style="padding-top:10px">
        <div class="chips" id="durChips"></div>
        <label class="checkline">下次不再询问 <input type="checkbox" id="cNoAsk" /></label>
      </section>
      <div class="actions">
        <button id="btnDurStart" class="key primary">开始</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlgQr">
  <div class="sheet">
    <header class="sheet-head">
      <h2>配对</h2>
    </header>
    <div class="sheet-body">
      <div id="qrBox">
        <div id="qrHolder"></div>
        <div id="qrFallback" class="err hidden">二维码库没加载出来，用下面的链接。</div>
        <div id="pairUrl"></div>
        <div class="actions" style="width:100%;margin-top:4px">
          <button id="btnCopyPair" class="key">复制配对链接</button>
          <button id="btnCopyDeep" class="key">复制扫码链接</button>
        </div>
        <div class="status" style="text-align:center;white-space:normal">APP 内：设置 → Socket 控制 → 扫码</div>
        <div class="actions" style="width:100%;margin-top:8px">
          <button id="btnCloseQr" class="key primary">关闭</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<script type="module">
// ============================================================ 常量

const MODULE_PRIMARY = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODULE_FALLBACK = 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14';
const WASM_PATH = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL_URLS = [
  'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  // 兜底：把模型放到 web/models/ 下，CDN 被墙时也能跑
  './models/pose_landmarker_lite.task',
];

const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8],[9,10],
  [11,12],[11,13],[13,15],[15,17],[15,19],[15,21],[17,19],
  [12,14],[14,16],[16,18],[16,20],[16,22],[18,20],
  [11,23],[12,24],[23,24],
  [23,25],[24,26],[25,27],[26,28],[27,29],[28,30],[29,31],[30,32],[27,31],[28,32],
];

const POINT_SETS = {
  torso: [11, 12, 23, 24],
  // 低姿态：跪、坐、土下坐时下肢看不见，这 9 点仍然稳定
  low: [0, 11, 12, 13, 14, 15, 16, 23, 24],
  full: [0, 11, 12, 15, 16, 23, 24, 25, 26, 27, 28],
  feet: [27, 28],
};

/** 关键点可见度下限：低于它的点不参与判定。0.3 是为了让跪坐姿态也能判。 */
const VIS_MIN = 0.3;

// ============================================================ 设置持久化

function loadSettings() {
  try {
    const raw = localStorage.getItem('coyote-cage-settings');
    return raw ? { ...DEFAULTS, ...JSON.parse(raw) } : { ...DEFAULTS };
  } catch {
    return { ...DEFAULTS };
  }
}

function saveSettings() {
  try { localStorage.setItem('coyote-cage-settings', JSON.stringify(S)); } catch {}
}

function loadRoi() {
  try {
    const raw = localStorage.getItem('coyote-cage-roi');
    if (raw) return JSON.parse(raw);
  } catch {}
  return { l: 0.2, t: 0.12, r: 0.8, b: 0.88 };
}

function saveRoi() {
  try { localStorage.setItem('coyote-cage-roi', JSON.stringify(roi)); } catch {}
}

// ============================================================ 工具

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const mirrored = () => facing === 'user';

function toDisplay(p) {
  return { x: mirrored() ? 1 - p.x : p.x, y: p.y };
}

function contentRect() {
  const vw = video.videoWidth || 4;
  const vh = video.videoHeight || 3;
  const bw = stage.clientWidth;
  const bh = stage.clientHeight;
  const scale = Math.min(bw / vw, bh / vh);
  const w = vw * scale;
  const h = vh * scale;
  return { x: (bw - w) / 2, y: (bh - h) / 2, w, h };
}

function toPx(nx, ny) {
  const r = contentRect();
  return { x: r.x + nx * r.w, y: r.y + ny * r.h };
}

function fromPx(px, py) {
  const r = contentRect();
  return { x: clamp01((px - r.x) / r.w), y: clamp01((py - r.y) / r.h) };
}

function parseFrames(text) {
  const lines = String(text).split(/[\n,;\s]+/).map((s) => s.trim()).filter(Boolean);
  if (!lines.length) return null;
  for (const line of lines) if (!/^[0-9a-fA-F]{16}$/.test(line)) return null;
  return lines.map((l) => l.toUpperCase());
}

/** 把波形模板铺满 [ms]，一帧 100ms。 */
function buildFramesFor(text, ms) {
  const pattern = parseFrames(text);
  if (!pattern) return null;
  const count = Math.max(1, Math.ceil(ms / 100));
  return Array.from({ length: count }, (_, i) => pattern[i % pattern.length]);
}

function buildFrames() {
  return buildFramesFor(S.waveform, S.shockMs);
}

function targetFor(ms) {
  const base = Math.min(Math.max(S.base, 1), Math.max(S.max, 1));
  if (!S.escalate) return base;
  const steps = Math.floor(ms / 1000 / Math.max(1, S.everySec));
  return Math.min(base + steps * S.step, S.max);
}

/** 挑逗强度：基础强度的百分比，永远被强度上限夹住。 */
function teaseTarget() {
  const base = Math.min(Math.max(S.base, 1), Math.max(S.max, 1));
  return Math.max(1, Math.min(Math.max(S.max, 1), Math.round((base * S.teasePercent) / 100)));
}

/** 下一次挑逗的间隔（毫秒），在 [min, max] 之间随机。 */
function teaseInterval() {
  const lo = Math.max(1, Math.min(S.teaseMinSec, S.teaseMaxSec));
  const hi = Math.max(lo, S.teaseMaxSec);
  return (lo + Math.random() * (hi - lo)) * 1000;
}

function fmtClock(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const mm = String(Math.floor(total / 60)).padStart(2, '0');
  const ss = String(total % 60).padStart(2, '0');
  return mm + ':' + ss;
}

function setPhase(text, color) {
  const el = $('phase');
  el.textContent = text;
  el.style.color = color;
}

function setHint(text, visible = true) {
  hint.textContent = text;
  hint.classList.toggle('hidden', !visible);
}

// ============================================================ DG-LAB V4 客户端

class Dglab {
  constructor() {
    this.kind = 'relay';
    this.ws = null;
    this.phase = 'idle';
    this.controllerId = null;
    this.appId = null;
    this.devices = [];
    this.intensity = [0, 0];
    this.battery = null;
    this.message = '';
    this.pending = new Map();
    this.onchange = () => {};
    /** 调试模式：不建立任何网络连接，只把要下发的指令记进 debugLog。 */
    this.debugMode = false;
    this.debugLog = [];
  }

  emit() { this.onchange(); }

  connect(url) {
    this.disconnect();
    this.phase = 'connecting';
    this.emit();
    let ws;
    try {
      ws = new WebSocket(url);
    } catch (e) {
      this.phase = 'error';
      this.message = '地址无效';
      this.emit();
      return;
    }
    this.ws = ws;
    ws.onmessage = (ev) => this.handle(ev.data);
    ws.onerror = () => { this.phase = 'error'; this.message = '连接失败'; this.emit(); };
    ws.onclose = () => {
      this.phase = 'idle';
      this.appId = null;
      this.devices = [];
      this.emit();
    };
  }

  disconnect() {
    if (this.ws) { try { this.ws.close(); } catch {} }
    this.ws = null;
    this.phase = 'idle';
    this.controllerId = null;
    this.appId = null;
    this.devices = [];
    this.intensity = [0, 0];
    this.battery = null;
    this.message = '';
    this.debugMode = false;
    this.debugLog = [];
    for (const p of this.pending.values()) p.cancel();
    this.pending.clear();
    this.emit();
  }

  /**
   * 调试模式：**不建立任何网络连接**，但对外状态和正常连接完全一样
   * （phase = paired、有一个假设备），所以判定、惩罚、开关走的是同一条代码路径，
   * 只是 device.op 不再发出去，而是记到 debugLog。
   */
  connectDebug() {
    this.disconnect();
    this.debugMode = true;
    this.phase = 'paired';
    this.controllerId = 'debug-controller';
    this.appId = 'debug-app';
    this.devices = [{ slotId: 'debug-slot', name: '调试设备', type: 'COYOTE_030' }];
    this.battery = 100;
    this.appendDebug('调试模式已启用：不连接设备，只记录输出');
    this.emit();
  }

  appendDebug(text) {
    const d = new Date();
    const stamp = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map((n) => String(n).padStart(2, '0')).join(':') +
      '.' + String(d.getMilliseconds()).padStart(3, '0');
    this.debugLog.push({ time: stamp, text });
    if (this.debugLog.length > 120) this.debugLog.splice(0, this.debugLog.length - 120);
  }

  /** 把一条 device.op / 清队列指令翻译成人话，调试面板直接显示。 */
  describe(data) {
    const channel = data.c === 0 ? 'A' : 'B';
    if (data.t === 0) {
      const frames = Array.isArray(data.v) ? data.v : [];
      const first = frames[0] || '-';
      return `波形 ${channel} · ${data.d}ms · ${frames.length} 帧 · 首帧 ${first}`;
    }
    if (data.t === 3) {
      const delta = data.v;
      return `强度 ${channel} ${delta >= 0 ? '+' + delta : delta} → ${this.intensity[data.c]}`;
    }
    if (data.t === 7) return `归零 ${channel}`;
    return `op t=${data.t}`;
  }

  handle(text) {
    let msg;
    try { msg = JSON.parse(text); } catch { return; }
    switch (msg.type) {
      case 'hello':
        this.controllerId = msg.clientId;
        this.phase = 'waiting';
        this.emit();
        break;
      case 'client_attached':
        this.appId = msg.clientId;
        this.phase = 'paired';
        this.emit();
        this.refreshDevices();
        break;
      case 'client_disconnected':
        this.appId = null;
        this.devices = [];
        this.phase = this.controllerId ? 'waiting' : 'idle';
        this.emit();
        break;
      case 'message':
        this.onAppMessage(msg.data);
        break;
      case 'error':
        this.message = msg.error || '服务端错误';
        this.emit();
        break;
      case 'idle_timeout':
        this.phase = 'error';
        this.message = '5 分钟没有 APP 接入';
        this.emit();
        break;
      default:
        break;
    }
  }

  onAppMessage(data) {
    if (!data) return;
    if (data.t === 'resp') {
      const p = this.pending.get(data.reqId);
      if (p) { this.pending.delete(data.reqId); p.finish(data); }
      return;
    }
    if (data.t !== 'ev') return;
    if (data.ev === 'devices.snapshot') this.applyDevices(data.devices);
    else if (data.ev === 'devices.patch') this.applyPatch(data);
    else if (data.ev === 'slots.patch') this.applySlots(data.slots);
  }

  applyDevices(list) {
    if (!Array.isArray(list)) return;
    this.devices = list.map((d) => ({ slotId: d.slotId, name: d.name || '郊狼', type: d.type || '' }));
    list.forEach((d) => this.applyProps(d.props));
    this.emit();
  }

  applyPatch(data) {
    if (Array.isArray(data.added)) {
      for (const d of data.added) {
        this.devices = this.devices.filter((x) => x.slotId !== d.slotId);
        this.devices.push({ slotId: d.slotId, name: d.name || '郊狼', type: d.type || '' });
        this.applyProps(d.props);
      }
    }
    if (Array.isArray(data.removed)) {
      this.devices = this.devices.filter((d) => !data.removed.includes(d.slotId));
    }
    this.emit();
  }

  applySlots(slots) {
    if (!Array.isArray(slots)) return;
    slots.forEach((s) => this.applyProps(s.props));
    this.emit();
  }

  applyProps(props) {
    if (!props) return;
    if (typeof props.intensityA === 'number') this.intensity[0] = props.intensityA;
    if (typeof props.intensityB === 'number') this.intensity[1] = props.intensityB;
    if (typeof props.power === 'number') this.battery = props.power;
  }

  send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
  }

  post(data) {
    if (!this.appId) return;
    this.send({ type: 'message', clientId: this.appId, data });
  }

  rpc(method, params = null, timeout = 5000) {
    return new Promise((resolve) => {
      if (this.debugMode) {
        this.appendDebug(`RPC ${method}`);
        return resolve({ result: {} });
      }
      if (!this.appId) return resolve(null);
      const reqId = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
      const timer = setTimeout(() => { this.pending.delete(reqId); resolve(null); }, timeout);
      this.pending.set(reqId, {
        finish: (v) => { clearTimeout(timer); resolve(v); },
        cancel: () => { clearTimeout(timer); resolve(null); },
      });
      const payload = { t: 'req', reqId, m: method };
      if (params) payload.data = params;
      this.post(payload);
    });
  }

  op(data) {
    this.request('device.op', data);
  }

  request(method, data) {
    if (this.debugMode) {
      // 调试模式：只记录，绝不发出去
      this.appendDebug(method === 'device.op.clear'
        ? `清空 ${data && data.c === 1 ? 'B' : 'A'} 通道波形`
        : this.describe(data));
      this.emit();
      return;
    }
    if (!this.appId) return;
    this.post({
      t: 'req',
      reqId: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2),
      m: method,
      data,
    });
  }

  slot() { return this.devices[0] ? this.devices[0].slotId : null; }

  async refreshDevices() {
    const res = await this.rpc('devices.get');
    if (res && res.result && Array.isArray(res.result.devices)) this.applyDevices(res.result.devices);
  }

  setIntensity(target, channel) {
    const slot = this.slot();
    if (!slot) return;
    const delta = target - this.intensity[channel];
    if (!delta) return;
    // 先更新本地强度再下发，调试日志里显示的才是「下发后的强度」
    this.intensity[channel] = target;
    this.op({ s: slot, t: 3, c: channel, p: 1, v: delta });
    this.emit();
  }

  pulse(frames, durationMs, channel) {
    const slot = this.slot();
    if (!slot || !frames || !frames.length) return;
    this.op({ s: slot, t: 0, c: channel, p: 1, d: durationMs, v: frames });
  }

  clear(channel) {
    const slot = this.slot();
    if (!slot) return;
    this.request('device.op.clear', { s: slot, c: channel });
  }

  zero(channel) {
    const slot = this.slot();
    if (!slot) return;
    this.op({ s: slot, t: 7, c: channel, p: 1, v: 0 });
    this.intensity[channel] = 0;
    this.emit();
  }

  emergency() {
    const slot = this.slot();
    if (!slot) return;
    this.op({ s: slot, t: 7, c: 0, p: 1, v: 0 });
    this.op({ s: slot, t: 7, c: 1, p: 1, v: 0 });
    this.clear();
    this.intensity = [0, 0];
    this.emit();
  }
}

// ============================================================ 蓝牙直连（郊狼 3.0）

// 服务 0x180C：0x150A 写 / 0x150B 通知；电量服务 0x180A：0x1500 读
const BLE_SERVICE = 0x180c;
const BLE_WRITE_CHAR = 0x150a;
const BLE_NOTIFY_CHAR = 0x150b;
const BLE_BATT_SERVICE = 0x180a;
const BLE_BATT_CHAR = 0x1500;
const BLE_PUMP_MS = 100;

/** 16 位 HEX 帧 → 8 字节（前 4 频率，后 4 强度）。 */
function hexToBytes(frame) {
  if (typeof frame !== 'string' || frame.length !== 16) return null;
  const out = new Uint8Array(8);
  for (let i = 0; i < 8; i++) {
    const b = parseInt(frame.slice(i * 2, i * 2 + 2), 16);
    if (!Number.isFinite(b)) return null;
    out[i] = b;
  }
  return out;
}

/**
 * 本机直连郊狼主机的传输层。对外接口和 [Dglab] 一致
 * （phase/devices/intensity/battery/onchange + setIntensity/pulse/clear/zero/emergency），
 * 判定和输出节奏的代码完全不用改。
 *
 * 协议要点（DG-LAB V3 官方文档）：
 * - B0 指令 20 字节，每 100ms 写一次：HEAD + (序列号<<4 | 强度解读方式) + A强度 + B强度
 *   + A频率×4 + A强度×4 + B频率×4 + B强度×4
 * - 强度解读方式：高 2 bit 是 A、低 2 bit 是 B，3 = 绝对设定；序列号 0 表示不要回执
 * - 某通道 4 组数据里只要有一条强度 >100，该通道这 100ms 全部丢弃 → 用来实现「只打一路」
 * - BF 指令 7 字节：HEAD + A软上限 + B软上限 + A频率平衡 + B频率平衡 + A强度平衡 + B强度平衡
 *   软上限断电保存，所以每次重连都必须重写
 */
class BleCoyote {
  constructor() {
    this.kind = 'ble';
    this.phase = 'idle';
    this.controllerId = null;
    this.appId = null;
    this.devices = [];
    this.intensity = [0, 0];
    this.battery = null;
    this.message = '';
    this.onchange = () => {};
    // 与 Dglab 保持同样的字段，renderStatus 才能一视同仁
    this.debugMode = false;
    this.debugLog = [];

    this.device = null;
    this.writeChar = null;
    this.noResponse = false;
    this.pumpTimer = null;
    /** 应用想要的强度；下一包用绝对设定推过去。 */
    this.desired = [0, 0];
    /** 最后成功下发过的强度，-1 表示「和 desired 不一致」需要重推。 */
    this.sent = [-1, -1];
    /** 每个通道待播的波形帧，一帧一个 100ms。 */
    this.waveQueue = [[], []];
  }

  emit() { this.onchange(); }

  async connect() {
    this.teardown(false);

    if (!navigator.bluetooth) {
      this.phase = 'error';
      this.message = '这个浏览器不支持 Web Bluetooth';
      this.emit();
      return;
    }

    this.phase = 'connecting';
    this.emit();

    let device;
    try {
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: '47L' }],
        optionalServices: [BLE_SERVICE, BLE_BATT_SERVICE],
      });
    } catch (e) {
      // 用户取消选择不算错误
      this.phase = 'idle';
      this.message = '';
      this.emit();
      return;
    }

    this.device = device;
    device.addEventListener('gattserverdisconnected', () => {
      if (this.device === device) this.teardown(true);
    });

    try {
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(BLE_SERVICE);
      this.writeChar = await service.getCharacteristic(BLE_WRITE_CHAR);
      this.noResponse = !!(this.writeChar.properties && this.writeChar.properties.writeWithoutResponse);

      const notifyChar = await service.getCharacteristic(BLE_NOTIFY_CHAR);
      notifyChar.addEventListener('characteristicvaluechanged', (ev) => this.onNotify(ev.target.value));
      await notifyChar.startNotifications();

      this.phase = 'paired';
      this.appId = device.id || 'ble';
      this.devices = [{ slotId: 'ble', name: device.name || '郊狼 3.0', type: 'COYOTE_030' }];
      this.message = '';

      this.writeSoftLimit();
      this.readBattery(server).catch(() => {});
      this.startPump();
      this.emit();
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      this.teardown(false);
      this.phase = 'error';
      this.message = '蓝牙连接失败：' + msg;
      this.emit();
    }
  }

  disconnect() {
    this.teardown(true);
  }

  /** 断开并清空一切；[emitEvent] 用来避免断链回调里重复通知。 */
  teardown(emitEvent) {
    this.stopPump();
    const device = this.device;
    this.device = null;
    this.writeChar = null;
    if (device) {
      try { device.gatt.disconnect(); } catch {}
    }
    this.phase = 'idle';
    this.controllerId = null;
    this.appId = null;
    this.devices = [];
    this.intensity = [0, 0];
    this.battery = null;
    this.message = '';
    this.desired = [0, 0];
    this.sent = [-1, -1];
    this.waveQueue = [[], []];
    if (emitEvent) this.emit();
  }

  startPump() {
    this.stopPump();
    this.pump();
    this.pumpTimer = setInterval(() => this.pump(), BLE_PUMP_MS);
  }

  stopPump() {
    if (this.pumpTimer !== null) clearInterval(this.pumpTimer);
    this.pumpTimer = null;
  }

  write(buf) {
    if (!this.writeChar) return false;
    try {
      if (this.noResponse) {
        this.writeChar.writeValueWithoutResponse(buf);
      } else {
        const p = this.writeChar.writeValue(buf);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      }
      return true;
    } catch {
      return false;
    }
  }

  /** BF：强度软上限 + 波形平衡参数。软上限断电保存，每次重连都要写。 */
  writeSoftLimit() {
    const limit = Math.max(0, Math.min(200, Math.round(S.max)));
    const balF = S.balFreq & 0xff;
    const balS = S.balStrength & 0xff;
    this.write(new Uint8Array([0xbf, limit, limit, balF, balF, balS, balS]));
  }

  /** 塞一帧波形给某个通道；不足 100ms 的部分由下一包补空。 */
  pulse(frames, durationMs, channel) {
    if (!frames || !frames.length) return;
    this.waveQueue[channel] = frames.slice();
  }

  clear(channel) {
    this.waveQueue[channel] = [];
  }

  setIntensity(target, channel) {
    const v = Math.max(0, Math.min(200, Math.round(target)));
    this.desired[channel] = v;
  }

  zero(channel) {
    this.desired[channel] = 0;
  }

  emergency() {
    this.waveQueue = [[], []];
    this.desired = [0, 0];
    this.sent = [-1, -1];
    this.intensity = [0, 0];
    this.pump();
    this.emit();
  }

  /** 发一包 B0：强度按需绝对设定，波形按队列逐帧取。 */
  pump() {
    if (this.phase !== 'paired' || !this.writeChar) return;
    const buf = new Uint8Array(20);
    buf[0] = 0xb0;

    const modeA = this.desired[0] !== this.sent[0] ? 3 : 0;
    const modeB = this.desired[1] !== this.sent[1] ? 3 : 0;
    buf[1] = (modeA << 2) | modeB; // 序列号固定 0：不要回执，省一次往返
    buf[2] = modeA ? this.desired[0] : 0;
    buf[3] = modeB ? this.desired[1] : 0;
    if (modeA) { this.sent[0] = this.desired[0]; this.intensity[0] = this.desired[0]; }
    if (modeB) { this.sent[1] = this.desired[1]; this.intensity[1] = this.desired[1]; }

    this.fillWave(buf, 0, 4);
    this.fillWave(buf, 1, 12);
    this.write(buf);
  }

  fillWave(buf, channel, offset) {
    const queue = this.waveQueue[channel];
    const frame = queue.length ? hexToBytes(queue.shift()) : null;
    if (frame) {
      buf.set(frame.subarray(0, 4), offset);      // 4 组频率
      buf.set(frame.subarray(4, 8), offset + 4);  // 4 组强度
      return;
    }
    // 无效数据：频率 0（合法下限是 10）+ 强度 101，主机整段丢弃 → 这一路不输出
    buf.fill(0, offset, offset + 7);
    buf[offset + 7] = 101;
  }

  onNotify(value) {
    if (!value) return;
    const data = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
    if (data[0] !== 0xb1 || data.length < 4) return;
    this.intensity[0] = data[2];
    this.intensity[1] = data[3];
    // 拨轮被手动动过：标记成不一致，下一包用绝对设定压回应用的值
    if (data[2] !== this.desired[0]) this.sent[0] = -1;
    if (data[3] !== this.desired[1]) this.sent[1] = -1;
    this.emit();
  }

  async readBattery(server) {
    const svc = await server.getPrimaryService(BLE_BATT_SERVICE);
    const ch = await svc.getCharacteristic(BLE_BATT_CHAR);
    const value = await ch.readValue();
    this.battery = value.getUint8(0);
    this.emit();
  }
}

const relayLink = new Dglab();
const bleLink = new BleCoyote();
let dg = relayLink;

/** 切传输层：先把旧链路断干净，再把状态回调挂到新实例上。 */
function useLink(next) {
  if (dg === next) return;
  try { dg.disconnect(); } catch {}
  dg = next;
  dg.onchange = renderStatus;
}

/** 「连接」按当前意图走：先看调试模式，再看蓝牙还是中继。 */
function connectNow() {
  if (S.debugMode) {
    useLink(relayLink);
    dg.connectDebug();
    return;
  }
  if (S.linkMode === 'ble') {
    useLink(bleLink);
    dg.connect();
    return;
  }
  useLink(relayLink);
  dg.connect(S.relay);
}

// ============================================================ 摄像头 & 模型

async function startCamera(mode) {
  facing = mode;
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('当前页面不是安全上下文（需要 https 或 localhost），浏览器禁用了摄像头');
  }
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: mode, width: { ideal: 1280 }, height: { ideal: 960 } },
  });
  video.srcObject = stream;
  video.style.transform = mode === 'user' ? 'scaleX(-1)' : 'none';
  await video.play();
  if (!video.videoWidth) {
    await new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      video.addEventListener('loadedmetadata', finish, { once: true });
      setTimeout(finish, 1500);
    });
  }
  resizeOverlay();
}

/** 逐个试 CDN；每个都带超时，免得某个源「挂住不报错」把后手也堵死。 */
async function loadTasks() {
  const failures = [];
  for (const source of [MODULE_PRIMARY, MODULE_FALLBACK]) {
    try {
      return await withTimeout(import(source), 15000, '下载推理引擎');
    } catch (e) {
      failures.push(source + '：' + (e && e.message ? e.message : e));
      console.warn('[pose] 模块加载失败', source, e);
    }
  }
  throw new Error(failures.join('；'));
}

// ---- 关键点中值滤波：按时间窗（不是帧数），30fps 和 10fps 行为一致 ----
const FILTER_WINDOW_MS = 300;
const FILTER_MAX_FRAMES = 9;
let poseBuffer = [];

function median(values) {
  if (!values.length) return null;
  const sorted = values.slice().sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

/** 每个坐标取时间窗内的中位数；可见度取最新帧原值，避免把掉线抹平。 */
function smoothPoints(buffer, latestPoints) {
  const out = new Array(latestPoints.length);
  for (let i = 0; i < latestPoints.length; i++) {
    const xs = [];
    const ys = [];
    for (const frame of buffer) {
      const p = frame.points[i];
      if (!p) continue;
      xs.push(p.x);
      ys.push(p.y);
    }
    const last = latestPoints[i] || { x: 0, y: 0, visibility: 0 };
    out[i] = {
      x: median(xs) ?? last.x,
      y: median(ys) ?? last.y,
      visibility: last.visibility,
    };
  }
  return out;
}

function handlePoseResult(result) {
  if (!result || !result.landmarks || !result.landmarks.length) return;
  const now = performance.now();
  const raw = result.landmarks[0];
  poseBuffer.push({ ts: now, points: raw });
  while (poseBuffer.length && now - poseBuffer[0].ts > FILTER_WINDOW_MS) poseBuffer.shift();
  if (poseBuffer.length > FILTER_MAX_FRAMES) poseBuffer.splice(0, poseBuffer.length - FILTER_MAX_FRAMES);
  latest = { points: smoothPoints(poseBuffer, raw), ts: now };
}

// ---- 模型加载：分阶段超时 + 已用秒数 + 失败可重试 ----

/** 每个阶段最多等多久。WebView 里 GPU 委托会静默挂死，不设超时就会永远停在提示上。 */
const STAGE_TIMEOUT_MS = 25000;

/** 把 promise 套上超时，超时也变成一次可处理的失败。 */
function withTimeout(promise, ms, label) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(
      () => reject(new Error(label + '超过 ' + Math.round(ms / 1000) + ' 秒没有响应')),
      ms,
    );
    promise.then(
      (value) => { clearTimeout(timer); resolve(value); },
      (error) => { clearTimeout(timer); reject(error); },
    );
  });
}

let loadingTimer = null;

/** 加载中的提示，每秒刷新已用时间，让「卡住」和「慢」能区分开。 */
function showLoading(text) {
  stopLoading();
  const started = performance.now();
  const paint = () => {
    const sec = Math.floor((performance.now() - started) / 1000);
    setHint(text + (sec > 0 ? '（' + sec + 's）' : ''), true);
  };
  paint();
  loadingTimer = setInterval(paint, 1000);
}

function stopLoading() {
  if (loadingTimer !== null) clearInterval(loadingTimer);
  loadingTimer = null;
}

const isWebView = () => /;\s*wv\)/.test(navigator.userAgent || '');

/**
 * 要试的「模型 × 委托」顺序。
 * 本机模型放第一位：同源、不走 CDN，也不再依赖 storage.googleapis.com。
 * WebView 里排到最后才试 GPU —— 它的 GPU 委托会挂死不 reject，是这次卡住的元凶。
 */
function poseAttempts(webview) {
  const local = MODEL_URLS[1];
  const cdn = MODEL_URLS[0];
  return webview
    ? [[local, 'CPU'], [cdn, 'CPU'], [cdn, 'GPU']]
    : [[local, 'GPU'], [local, 'CPU'], [cdn, 'CPU']];
}

async function startPose() {
  showLoading('正在下载推理引擎…');
  const { FilesetResolver, PoseLandmarker } = await loadTasks();

  showLoading('正在准备 wasm…');
  const fileset = await withTimeout(
    FilesetResolver.forVisionTasks(WASM_PATH),
    STAGE_TIMEOUT_MS,
    '加载推理引擎',
  );

  const create = (modelUrl, delegate) => PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: modelUrl, delegate },
    runningMode: 'LIVE_STREAM',
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
    minTrackingConfidence: 0.35,
    resultCallback: handlePoseResult,
  });

  let lastError = null;
  const attempts = poseAttempts(isWebView());
  for (let i = 0; i < attempts.length; i++) {
    const [url, delegate] = attempts[i];
    const name = url === MODEL_URLS[1] ? '本机模型' : '在线模型';
    showLoading(`正在加载${name}（${delegate}，第 ${i + 1}/${attempts.length} 次）…`);
    try {
      pose = await withTimeout(create(url, delegate), STAGE_TIMEOUT_MS, `加载${name}（${delegate}）`);
      lastError = null;
      break;
    } catch (e) {
      lastError = e;
      console.warn('[pose] 初始化失败', delegate, url, e);
    }
  }
  if (!pose) throw lastError || new Error('模型初始化失败');
}

function resizeOverlay() {
  const dpr = window.devicePixelRatio || 1;
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  overlay.width = Math.max(1, Math.round(w * dpr));
  overlay.height = Math.max(1, Math.round(h * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ============================================================ 主循环

function loop(now) {
  if (pose && video.readyState >= 2 && now - lastDetect > 66) {
    lastDetect = now;
    try { pose.detectForVideo(video, now, handlePoseResult); } catch (e) { /* 丢帧 */ }
  }
  draw();
  requestAnimationFrame(loop);
}

/** 四角括号路径（取景器语言，判定框和越界框共用）。 */
function cornerPath(x, y, w, h, len) {
  ctx.beginPath();
  ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
  ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
  ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
  ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
}

function draw() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  ctx.clearRect(0, 0, w, h);

  // 越界：整屏信号色细框 + 四角加粗
  if (isLive() && violating) {
    ctx.strokeStyle = 'rgba(255,75,31,.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);
    ctx.strokeStyle = '#FF4B1F';
    ctx.lineWidth = 4;
    cornerPath(8, 8, w - 16, h - 16, 34);
    ctx.stroke();
  }

  // 判定框（姿势模式没有框）：细线 + 四角括号
  const showBox = S.frameMode !== 'pose';
  const a = toPx(roi.l, roi.t);
  const b = toPx(roi.r, roi.b);
  const x = Math.min(a.x, b.x);
  const y = Math.min(a.y, b.y);
  const rw = Math.abs(b.x - a.x);
  const rh = Math.abs(b.y - a.y);
  if (showBox) {
    ctx.fillStyle = violating ? 'rgba(255,75,31,.08)' : 'rgba(111,227,164,.05)';
    ctx.fillRect(x, y, rw, rh);

    ctx.strokeStyle = violating ? 'rgba(255,75,31,.55)' : 'rgba(233,230,222,.35)';
    ctx.lineWidth = 1;
    if (selecting) ctx.setLineDash([8, 7]);
    ctx.strokeRect(x, y, rw, rh);
    ctx.setLineDash([]);

    ctx.strokeStyle = violating ? '#FF4B1F' : '#6FE3A4';
    ctx.lineWidth = 3;
    cornerPath(x, y, rw, rh, Math.min(22, Math.min(rw, rh) * 0.28));
    ctx.stroke();
  }

  // 骨架：框模式按是否在框内变色，姿势模式按是否越界变色
  const pts = latest ? latest.points : [];
  if (pts.length) {
    const px = pts.map((p) => {
      if (!p || (p.visibility !== undefined && p.visibility < VIS_MIN)) return null;
      const d = toDisplay(p);
      const inside = showBox
        ? (d.x >= roi.l && d.x <= roi.r && d.y >= roi.t && d.y <= roi.b)
        : !violating;
      return { pt: toPx(d.x, d.y), inside };
    });

    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    for (const [i, j] of CONNECTIONS) {
      const p1 = px[i];
      const p2 = px[j];
      if (!p1 || !p2) continue;
      ctx.strokeStyle = p1.inside && p2.inside ? '#6FE3A4' : '#FF4B1F';
      ctx.beginPath();
      ctx.moveTo(p1.pt.x, p1.pt.y);
      ctx.lineTo(p2.pt.x, p2.pt.y);
      ctx.stroke();
    }

    for (const p of px) {
      if (!p) continue;
      ctx.fillStyle = p.inside ? '#6FE3A4' : '#FF4B1F';
      ctx.beginPath();
      ctx.arc(p.pt.x, p.pt.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 准备倒计时
  if (prepareRemaining > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.85)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#F2B33D';
    ctx.font = '600 96px ui-monospace, "SF Mono", Consolas, monospace';
    ctx.fillText(String(Math.ceil(prepareRemaining / 1000)), w / 2, h / 2 - 6);
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(233,230,222,.75)';
    ctx.font = '600 11px ui-monospace, Consolas, monospace';
    ctx.fillText(S.frameMode === 'pose' ? '摆好姿势' : '准备', w / 2, h / 2 + 62);
    ctx.restore();
  }

  // 拖拽预览
  if (selecting && dragStart && dragNow) {
    const lx = Math.min(dragStart.x, dragNow.x);
    const ty = Math.min(dragStart.y, dragNow.y);
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(lx, ty, Math.abs(dragNow.x - dragStart.x), Math.abs(dragNow.y - dragStart.y));
    ctx.setLineDash([]);
  }
}

// ============================================================ 判定 + 惩罚

/** 取当前判定部位里可见的点（显示坐标系）。 */
function visiblePoints(points) {
  const indices = POINT_SETS[S.pointSet] || POINT_SETS.torso;
  const out = [];
  for (const i of indices) {
    const p = points[i];
    if (!p) continue;
    if ((p.visibility ?? 1) < VIS_MIN) continue;
    const d = toDisplay(p);
    if (!Number.isFinite(d.x) || !Number.isFinite(d.y)) continue;
    out.push(d);
  }
  return out;
}

/**
 * 是否越界。返回 null 表示「这一帧不可判」（可见点太少），交给姿态丢失策略。
 * bbox 模式：可见点外接框的中心出框即越界。
 */
function isOutside(points) {
  const pts = visiblePoints(points);

  if (S.judgeMode === 'bbox') {
    if (pts.length < 2) return null;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of pts) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    return cx < roi.l || cx > roi.r || cy < roi.t || cy > roi.b;
  }

  if (!pts.length) return null;
  for (const p of pts) {
    if (p.x < roi.l || p.x > roi.r || p.y < roi.t || p.y > roi.b) return true;
  }
  return false;
}

/** 当前姿态与基准的最大偏差，按画面高度归一；可比对点不足 2 个返回 -1。 */
function maxDeviation(reference, current) {
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  const indices = POINT_SETS[S.pointSet] || POINT_SETS.torso;
  let max = -1;
  let compared = 0;
  for (const i of indices) {
    const base = reference[i];
    const now = current[i];
    if (!base || !now) continue;
    if ((base.visibility ?? 1) < VIS_MIN || (now.visibility ?? 1) < VIS_MIN) continue;
    const dx = (base.x - now.x) * vw;
    const dy = (base.y - now.y) * vh;
    const d = Math.hypot(dx, dy) / vh;
    compared++;
    if (d > max) max = d;
  }
  return compared >= 2 ? max : -1;
}

function usablePose(points) {
  if (!points || points.length < 33) return false;
  const indices = POINT_SETS[S.pointSet] || POINT_SETS.torso;
  let visible = 0;
  for (const i of indices) {
    const p = points[i];
    if (!p) continue;
    if ((p.visibility ?? 1) >= VIS_MIN) visible++;
  }
  return visible >= 2;
}

// 随机框：画面四等分，新框不在上一个象限；上半屏概率 10%
const TOP_QUADRANT_CHANCE = 0.10;

function quadrantOf(rect) {
  const cx = (rect.l + rect.r) / 2;
  const cy = (rect.t + rect.b) / 2;
  return (cy < 0.5 ? 0 : 2) + (cx < 0.5 ? 0 : 1);
}

function randomRect(previous, rnd) {
  const top = rnd() < TOP_QUADRANT_CHANCE;
  const base = top ? 0 : 2;
  let quadrant = base + Math.floor(rnd() * 2);
  if (quadrant === previous) quadrant = base + ((quadrant - base + 1) % 2);
  const width = 0.16 + rnd() * (0.46 - 0.16);
  const height = 0.18 + rnd() * (0.46 - 0.18);
  const cellX = (quadrant % 2) * 0.5;
  const cellY = Math.floor(quadrant / 2) * 0.5;
  const left = cellX + rnd() * (0.5 - width);
  const topY = cellY + rnd() * (0.5 - height);
  return { rect: { l: left, t: topY, r: left + width, b: topY + height }, quadrant };
}

async function fire(target) {
  const frames = buildFrames();
  if (!frames) return;
  if (outputChannel !== null && outputChannel !== S.channel) release();
  outputChannel = S.channel;
  dg.setIntensity(target, S.channel);
  dg.pulse(frames, S.shockMs, S.channel);
}

function release() {
  outputChannel = null;
  dg.emergency();
}

let outputChannel = null;
let testTimer = null;

function cancelTest() {
  if (testTimer !== null) clearTimeout(testTimer);
  testTimer = null;
}

function cancelTease() {
  if (teaseTimer !== null) clearTimeout(teaseTimer);
  teaseTimer = null;
}

/** 一次挑逗：抬到挑逗强度 → 打一记短波形 → 归零。 */
function runTease() {
  const text = S.teaseWaveform || S.waveform;
  const frames = buildFramesFor(text, S.teaseMs);
  if (!frames) return;
  release();
  outputChannel = S.channel;
  dg.setIntensity(teaseTarget(), S.channel);
  dg.pulse(frames, S.teaseMs, S.channel);
  teaseTimer = setTimeout(() => {
    teaseTimer = null;
    release();
  }, S.teaseMs + 150);
}

function paintTimer() {
  const btn = $('btnTimer');
  if (limitMs <= 0) {
    btn.classList.add('hidden');
    $('timerMenu').classList.add('hidden');
    return;
  }
  btn.classList.remove('hidden');
  btn.innerHTML = '剩余 <b>' + fmtClock(limitMs - sessionActiveMs) + '</b>';
}

function syncRunButton() {
  // 单一开关：运行中也是实心主按钮，关闭是唯一出口，不能看起来像禁用
  $('btnRun').textContent = isLive() ? '关闭' : '开始';
}

function startSession() {
  if (dg.phase !== 'paired' || isLive()) return;
  cancelTest();
  cancelTease();
  release();

  const now = performance.now();
  const prepMs = Math.max(0, S.prepareSec) * 1000;

  outsideMs = 0;
  lastShockAt = 0;
  wasViolating = false;
  violating = false;
  referencePose = null;
  seenPose = false;
  sessionActiveMs = 0;
  limitMs = Math.max(0, S.sessionMinutes) * 60000;
  endReason = '';

  prepareEndsAt = now + prepMs;
  prepareRemaining = prepMs;
  state = prepMs > 0 ? Session.PREPARING : Session.RUNNING;

  nextTeaseAt = now + teaseInterval();

  if (S.frameMode === 'random') {
    const next = randomRect(lastQuadrant, Math.random);
    lastQuadrant = next.quadrant;
    roi = next.rect;
    nextRandomAt = now + Math.max(5, S.randomEverySec) * 1000;
  }

  stage.classList.toggle('live', true);
  $('timerMenu').classList.add('hidden');
  syncRunButton();
  setPhase(state === Session.PREPARING ? '准备中' : '监守中', state === Session.PREPARING ? '#F2B33D' : '#6FE3A4');
  $('meter').innerHTML = '';
  paintTimer();
  renderStatus();
}

/**
 * 结束会话。关闭、倒计时到点、连接中断都走这里。
 * 输出侧永远是 release() → 两路归零 + 清队列，和原急停同一条路径。
 */
function endSession(reason = 'stopped') {
  if (!isLive()) return;
  state = Session.ENDED;
  endReason = reason;
  outsideMs = 0;
  violating = false;
  wasViolating = false;
  prepareEndsAt = 0;
  prepareRemaining = 0;
  referencePose = null;
  seenPose = false;
  sessionActiveMs = 0;
  limitMs = 0;
  cancelTest();
  cancelTease();
  stage.classList.toggle('live', false);
  release();
  $('meter').innerHTML = '';
  $('timerMenu').classList.add('hidden');
  paintTimer();
  setPhase(
    reason === 'timeout' ? '时间到' : reason === 'disconnected' ? '连接中断' : '已结束',
    reason === 'disconnected' ? '#FF4B1F' : '#8B9099',
  );
  syncRunButton();
  renderStatus();
}

setInterval(() => {
  if (!isLive()) return;
  const now = performance.now();
  const f = latest;
  const fresh = !!f && now - f.ts < POSE_STALE_MS && f.points && f.points.length > 0;
  const usable = fresh && usablePose(f.points);
  if (usable) seenPose = true;

  // 开局准备倒计时：只走界面，不判定
  if (state === Session.PREPARING) {
    prepareRemaining = Math.max(0, prepareEndsAt - now);
    if (prepareRemaining > 0) {
      outsideMs = 0;
      wasViolating = false;
      violating = false;
      $('meter').innerHTML = `倒计时 <b>${Math.ceil(prepareRemaining / 1000)}</b>s`;
      setPhase('准备中', '#F2B33D');
      return;
    }
    prepareRemaining = 0;
    state = Session.RUNNING;
  }

  // 有效时长只在姿态新鲜时累加：人离开画面 / 切后台，计时冻结
  if (usable) sessionActiveMs += 60;
  if (limitMs > 0 && sessionActiveMs >= limitMs) {
    endSession('timeout');
    return;
  }

  // 随机框到点换位置
  if (S.frameMode === 'random' && now >= nextRandomAt) {
    const next = randomRect(lastQuadrant, Math.random);
    lastQuadrant = next.quadrant;
    roi = next.rect;
    nextRandomAt = now + Math.max(5, S.randomEverySec) * 1000;
  }

  let out = false;
  let deviation = 0;
  let unjudgeable = false;

  if (S.frameMode === 'pose') {
    if (!referencePose) {
      // 倒计时结束，抓第一帧可用姿态当基准；抓到的这一帧不算越界
      if (usable) {
        referencePose = f.points.map((p) => ({ x: p.x, y: p.y, visibility: p.visibility }));
        out = false;
      } else {
        unjudgeable = true;
      }
    } else if (usable) {
      deviation = maxDeviation(referencePose, f.points);
      if (deviation < 0) unjudgeable = true;
      else out = deviation > S.poseTolerance / 100;
    } else {
      unjudgeable = true;
    }
  } else if (!usable) {
    unjudgeable = true;
  } else {
    const r = isOutside(f.points);
    if (r === null) unjudgeable = true;
    else out = r;
  }

  // 姿态丢失策略。开局还没见过人时不罚，避免刚点开始就凭空挨一下。
  if (unjudgeable) {
    if (!seenPose || S.poseLost === 'pause') out = false;
    else if (S.poseLost === 'ignore') out = wasViolating;
    else out = true;
  }

  // 随机框和姿势锁定都没有容忍时间
  const grace = (S.frameMode === 'random' || S.frameMode === 'pose') ? 0 : S.graceMs;
  outsideMs = out ? outsideMs + 60 : 0;
  violating = out && outsideMs >= grace;
  const target = targetFor(outsideMs);

  if (violating && now - lastShockAt >= S.shockMs + S.gapMs) {
    lastShockAt = now;
    cancelTease();
    fire(target);
  } else if (!violating && wasViolating) {
    release();
  }
  wasViolating = violating;

  // 挑逗：只在监守且未越界时触发；越界中直接跳过一次，不补发也不顺延
  if (!S.tease) {
    cancelTease();
  } else if (violating) {
    cancelTease();
    nextTeaseAt = now + teaseInterval();
  } else if (teaseTimer === null && now >= nextTeaseAt) {
    nextTeaseAt = now + teaseInterval();
    runTease();
  }

  if (S.frameMode === 'pose') {
    $('meter').innerHTML =
      `偏差 <b>${deviation.toFixed(1)}</b>% / 容差 <b>${S.poseTolerance}</b>% · 强度 <b>${target}</b>`;
  } else if (S.frameMode === 'random') {
    const left = Math.max(0, Math.ceil((nextRandomAt - now) / 1000));
    $('meter').innerHTML =
      `越界 <b>${(outsideMs / 1000).toFixed(1)}</b>s · 强度 <b>${target}</b> · 下一个框 <b>${left}</b>s`;
  } else {
    $('meter').innerHTML = `越界 <b>${(outsideMs / 1000).toFixed(1)}</b>s · 目标强度 <b>${target}</b>`;
  }

  if (violating) setPhase('越界中', '#FF4B1F');
  else if (!usable) setPhase('姿态不可信', '#FF4B1F');
  else setPhase('监守中', '#6FE3A4');

  paintTimer();
}, 60);

function renderDebugLog() {
  const box = $('debugLog');
  if (!box) return;
  const rows = dg.debugLog.slice(-12);
  box.innerHTML = rows.length
    ? rows.map((e) => `<div>${e.time}  ${escapeHtml(e.text)}</div>`).join('')
    : '<div class="empty">还没有输出，点「连接」后跑一次就有了</div>';
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function renderStatus() {
  const el = $('status');
  const btn = $('btnConn');
  btn.disabled = false;

  // 会话中掉链：立刻收摊，不必等用户发现
  if (isLive() && dg.phase !== 'paired') endSession('disconnected');

  if (dg.phase === 'idle') {
    const ble = S.linkMode === 'ble' && !S.debugMode;
    el.textContent = S.debugMode ? '未连接 · 调试模式' : ble ? '未连接 · 蓝牙直连' : '未连接';
    btn.textContent = ble ? '蓝牙连接' : '连接';
    btn.onclick = connectNow;
  } else if (dg.phase === 'connecting') {
    el.textContent = S.linkMode === 'ble' && !S.debugMode ? '正在连接蓝牙…' : '正在连接中继…';
    btn.textContent = '连接中…';
    btn.disabled = true;
  } else if (dg.phase === 'waiting') {
    el.textContent = '等待 DG-LAB APP 扫码';
    btn.textContent = '二维码';
    btn.onclick = openQr;
  } else if (dg.phase === 'paired') {
    const dev = dg.devices[0];
    const bits = [];
    if (dev) bits.push(dev.name || dev.type || '郊狼');
    bits.push(`A ${dg.intensity[0]} / B ${dg.intensity[1]}`);
    if (dg.battery !== null) bits.push(`${dg.battery}%`);
    const prefix = dg.debugMode
      ? '调试中（不连接设备） · '
      : dg.kind === 'ble' ? '蓝牙已连接 · ' : '已连接 · ';
    el.textContent = prefix + bits.join(' · ');
    btn.textContent = '断开';
    btn.onclick = () => dg.disconnect();
  } else {
    el.textContent = '连接异常' + (dg.message ? ' · ' + dg.message : '');
    btn.textContent = '重连';
    btn.onclick = connectNow;
  }

  $('btnRun').disabled = !(dg.phase === 'paired' || isLive());

  const chip = $('btnMode');
  const ble = S.linkMode === 'ble';
  chip.textContent = ble ? '蓝牙' : '中继';
  chip.classList.toggle('on', ble);
  chip.title = ble ? '当前：蓝牙直连（点击切回中继）' : '当前：中继（点击切到蓝牙直连）';

  $('rowDebug').classList.toggle('hidden', !S.debugMode);
  $('cDebug').checked = S.debugMode;
  if (S.debugMode) renderDebugLog();
}

dg.onchange = renderStatus;

// ---- 开始前的时长弹窗 ----
const DURATION_CHOICES = [10, 20, 30, 45, 60, 0];
let pendingMinutes = 0;

function paintDurationChips() {
  const row = $('durChips');
  row.innerHTML = '';
  for (const minutes of DURATION_CHOICES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = minutes === 0 ? '不限' : minutes + ' 分钟';
    btn.classList.toggle('on', minutes === pendingMinutes);
    btn.onclick = () => {
      pendingMinutes = minutes;
      paintDurationChips();
    };
    row.appendChild(btn);
  }
}

function openDuration() {
  pendingMinutes = Math.max(0, S.sessionMinutes);
  $('cNoAsk').checked = false;
  paintDurationChips();
  if (!$('dlgDur').open) $('dlgDur').showModal();
}

$('btnCloseDur').onclick = () => $('dlgDur').close();

$('btnDurStart').onclick = () => {
  S.sessionMinutes = pendingMinutes;
  if ($('cNoAsk').checked) S.askDuration = false;
  saveSettings();
  $('rSession').value = S.sessionMinutes;
  $('oSession').textContent = S.sessionMinutes;
  $('dlgDur').close();

};

$('btnPlus5').onclick = () => {
  if (limitMs > 0) limitMs += 5 * 60000;

$('btnNoLimit').onclick = () => {
  limitMs = 0;
  $('timerMenu').classList.add('hidden');

$('btnTimer').onclick = () => {

};

overlay.addEventListener('pointerdown', (e) => {
  if (!selecting) return;
  const rect = overlay.getBoundingClientRect();
  dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  dragNow = { ...dragStart };
  overlay.setPointerCapture(e.pointerId);
});

overlay.addEventListener('pointermove', (e) => {
  if (!selecting || !dragStart) return;
  const rect = overlay.getBoundingClientRect();
  dragNow = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});

overlay.addEventListener('pointerup', () => {
  if (!selecting || !dragStart || !dragNow) return;
  const p1 = fromPx(dragStart.x, dragStart.y);
  const p2 = fromPx(dragNow.x, dragNow.y);
  const r = {
    l: Math.min(p1.x, p2.x),
    t: Math.min(p1.y, p2.y),
    r: Math.max(p1.x, p2.x),
    b: Math.max(p1.y, p2.y),
  };
  if (r.r - r.l > 0.05 && r.b - r.t > 0.05) {
    roi = r;
    saveRoi();
  }
  dragStart = null;
  dragNow = null;
  selecting = false;
  $('btnSel').textContent = '框选';
  setHint('', false);
});

// ============================================================ 设置面板

function bindRange(id, outId, key, toValue = (v) => v) {
  const input = $(id);
  const out = $(outId);
  input.value = S[key];
  out.textContent = S[key];
  input.addEventListener('input', () => {
    S[key] = toValue(+input.value);
    out.textContent = S[key];
    saveSettings();
  });
}

function bindSelect(id, key, toValue = (v) => v) {
  const el = $(id);
  el.value = S[key];
  el.addEventListener('change', () => {
    S[key] = toValue(el.value);
    saveSettings();
  });
}

/** 按框模式显示/隐藏对应参数，并禁用不适用的按钮。 */
function syncFrameRows() {
  const mode = S.frameMode;
  $('rowRandom').classList.toggle('hidden', mode !== 'random');
  $('rowPose').classList.toggle('hidden', mode !== 'pose');
  const sel = $('btnSel');
  if (sel) sel.disabled = mode !== 'manual';
  if (mode !== 'manual' && selecting) {
    selecting = false;
    if (sel) sel.textContent = '框选';
    setHint('', false);
  }
}

/** 挑逗参数联动：最短不能超过最长，开关决定整组是否显示。 */
function syncTease() {
  if (S.teaseMaxSec < S.teaseMinSec) S.teaseMaxSec = S.teaseMinSec;
  $('rTeaseMax').value = S.teaseMaxSec;
  $('oTeaseMax').textContent = S.teaseMaxSec;
  $('rowTease').classList.toggle('hidden', !S.tease);
  $('rowTeaseTest').classList.toggle('hidden', !S.tease);
}

const hasBluetooth = () => typeof navigator !== 'undefined' && !!navigator.bluetooth;

/** 连接方式联动：中继地址 / 蓝牙平衡参数各自只在对应模式下显示。 */
function syncLinkRows() {
  const ble = S.linkMode === 'ble';
  $('rowRelay').classList.toggle('hidden', ble);
  $('rowBle').classList.toggle('hidden', !ble);
  $('bleHint').classList.toggle('hidden', !ble || hasBluetooth());
  $('bleWarn').classList.toggle('hidden', !ble);
}

/** 软上限断电保存，改了强度上限或平衡参数就立刻推给设备。 */
function pushSoftLimit() {
  if (dg === bleLink && bleLink.phase === 'paired') bleLink.writeSoftLimit();
}

/** 切连接方式：先把当前链路断干净再记偏好。顶栏胶囊和设置下拉共用这一个入口。 */
function setLinkMode(mode) {
  const next = mode === 'ble' ? 'ble' : 'relay';
  if (S.linkMode !== next) {
    try { dg.disconnect(); } catch {}
    S.linkMode = next;
    saveSettings();
  }
  $('selLink').value = next;
  syncLinkRows();
  renderStatus();
}

function initSettingsUI() {
  bindRange('rBase', 'oBase', 'base');
  bindRange('rMax', 'oMax', 'max');
  bindRange('rStep', 'oStep', 'step');
  bindRange('rEvery', 'oEvery', 'everySec');
  bindRange('rShock', 'oShock', 'shockMs');
  bindRange('rGap', 'oGap', 'gapMs');
  bindRange('rGrace', 'oGrace', 'graceMs');
  bindRange('rPrepare', 'oPrepare', 'prepareSec');
  bindRange('rRandom', 'oRandom', 'randomEverySec');
  bindRange('rPoseTol', 'oPoseTol', 'poseTolerance');
  bindRange('rSession', 'oSession', 'sessionMinutes');

  const esc = $('cEsc');
  esc.checked = S.escalate;
  esc.addEventListener('change', () => { S.escalate = esc.checked; saveSettings(); });

  const ask = $('cAsk');
  ask.checked = S.askDuration;
  ask.addEventListener('change', () => { S.askDuration = ask.checked; saveSettings(); });

  bindSelect('selPoint', 'pointSet');
  bindSelect('selJudge', 'judgeMode');

  $('rBalS').addEventListener('input', pushSoftLimit);
  $('rMax').addEventListener('input', pushSoftLimit);
  syncLinkRows();

  // ---- 挑逗 ----
  const tease = $('cTease');
  tease.checked = S.tease;
  tease.addEventListener('change', () => { S.tease = tease.checked; saveSettings(); syncTease(); });

  bindRange('rTeaseMin', 'oTeaseMin', 'teaseMinSec');
  bindRange('rTeaseMax', 'oTeaseMax', 'teaseMaxSec');
  bindRange('rTeasePct', 'oTeasePct', 'teasePercent');
  bindRange('rTeaseMs', 'oTeaseMs', 'teaseMs');
  $('rTeaseMin').addEventListener('input', syncTease);
  $('rTeaseMax').addEventListener('input', syncTease);

  const waveSel = $('selTeaseWave');
  waveSel.innerHTML = '<option value="">跟随主波形</option>';
  for (const name of Object.keys(PRESETS)) {
    const opt = document.createElement('option');
    opt.value = PRESETS[name];
    opt.textContent = name;
    waveSel.appendChild(opt);
  }
  waveSel.value = S.teaseWaveform;
  waveSel.addEventListener('change', () => {
    S.teaseWaveform = waveSel.value;
    saveSettings();
  });
  syncTease();

  const wave = $('txtWave');
  const err = $('waveErr');
  const syncWave = () => {
    const ok = parseFrames(wave.value) !== null;
    err.classList.toggle('hidden', ok);
    wave.style.borderColor = ok ? '#3a3a3e' : '#ff5b52';
  };
  wave.value = S.waveform;
  wave.addEventListener('input', () => {
    S.waveform = wave.value;
    saveSettings();
    syncWave();
  });
  syncWave();

  const presetRow = $('presetRow');
  for (const [name, text] of Object.entries(PRESETS)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.onclick = () => {
      wave.value = text;
      S.waveform = text;
      saveSettings();
      syncWave();
    };
    presetRow.appendChild(btn);
  }

  const relay = $('txtRelay');
  relay.value = S.relay;
  relay.addEventListener('input', () => { S.relay = relay.value.trim(); saveSettings(); });

  const dbg = $('cDebug');
  dbg.checked = S.debugMode;
  dbg.addEventListener('change', () => {
    S.debugMode = dbg.checked;
    saveSettings();
    // 切换调试模式时把已有连接（真实的或调试的）断掉，避免状态串味；
    // 断开后由「连接」按钮按新意图重新连（调试模式连的是假设备）
    dg.disconnect();
    renderStatus();
  });
}

    testTimer = null;
    release();

};

// ============================================================ 二维码

function buildPairUrl(relay, id) {
  const base = relay.trim().replace(/\/+$/, '');
  return base.includes('?') ? `${base}&tid=${id}` : `${base}?tid=${id}`;
}

function copyText(text) {
  if (!text || !navigator.clipboard) return;
  navigator.clipboard.writeText(text).catch(() => {});
}

let qrApiPromise = null;

/** 二维码库按需加载：优先 jsDelivr 的 ESM 构建，失败就退化成纯文本链接。 */
function loadQrApi() {
  if (qrApiPromise) return qrApiPromise;
  qrApiPromise = (async () => {
    if (window.QRCode && typeof window.QRCode.toCanvas === 'function') return window.QRCode;
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm');
      const api = mod.default || mod;
      if (api && typeof api.toCanvas === 'function') return api;
    } catch (e) {
      console.warn('[qr] 加载失败', e);
    }
    return null;
  })();
  return qrApiPromise;
}

async function openQr() {
  const pair = dg.controllerId ? buildPairUrl(S.relay, dg.controllerId) : '';
  const deep = pair ? QR_PREFIX + encodeURIComponent(pair) : '';
  $('pairUrl').textContent = pair || '还没拿到配对 ID';
  $('btnCopyPair').onclick = () => copyText(pair);
  $('btnCopyDeep').onclick = () => copyText(deep);

  const holder = $('qrHolder');
  const fallback = $('qrFallback');
  holder.innerHTML = '';

  const api = pair ? await loadQrApi() : null;
  if (api) {
    const canvas = document.createElement('canvas');
    holder.appendChild(canvas);
    api.toCanvas(canvas, deep, { width: 232, margin: 1 }, (err) => {
      if (err) fallback.classList.remove('hidden');
    });
    fallback.classList.add('hidden');
  } else {
    fallback.classList.remove('hidden');
  }

  if (!$('dlgQr').open) $('dlgQr').showModal();
}

$('btnCloseQr').onclick = () => $('dlgQr').close();

// 关页面时尽量把蓝牙直连的强度归零再断开（尽力而为，异步写不保证完成）
window.addEventListener('pagehide', () => {
  if (dg === bleLink && bleLink.phase === 'paired') {
    try { bleLink.emergency(); bleLink.disconnect(); } catch {}
  }
});

let looping = false;

/** 加载姿态模型；失败时把原因写在画面中间，点一下就能重试。 */
async function loadPose() {
  try {
    await startPose();
    stopLoading();
    hint.classList.remove('retry');
    hint.onclick = null;
    setHint('', false);
    if (!looping) {
      looping = true;
      requestAnimationFrame(loop);
    }
    return true;
  } catch (e) {
    console.error('[pose] 加载失败', e);
    stopLoading();
    const msg = (e && e.message) ? e.message : String(e);
    setHint('姿态模型加载失败：' + msg + '\n点这里重试', true);
    hint.classList.add('retry');
    hint.onclick = () => {
      hint.onclick = null;
      hint.classList.remove('retry');
      loadPose();
    };
    return false;
  }
}

async function boot() {
  initSettingsUI();
  renderStatus();
  syncRunButton();
  paintTimer();

  try {
    await startCamera(facing);
  } catch (e) {
    setHint('摄像头打不开：' + e.message);
    return;
  }

  await loadPose();
}

boot();
</script>
</body>
</html>
